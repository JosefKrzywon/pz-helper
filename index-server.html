<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PZ Skill Books Checklist (Self-Hosted)</title>
<style>
  :root {
    --bg: #14171a;
    --card: #1f2428;
    --accent: #7fbf3f;
    --accent-dim: #3d5a20;
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --border: #2c3237;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    padding-bottom: 60px;
  }
  /* Tab Navigation */
  .tab-nav {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 14px 16px;
    background: var(--card);
    border: none;
    color: var(--text-dim);
    font-size: 0.95em;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .tab-btn:not(:last-child) {
    border-right: 1px solid var(--border);
  }
  .tab-btn:hover {
    background: #282d32;
  }
  .tab-btn.active {
    background: var(--accent-dim);
    color: var(--accent);
    font-weight: 600;
  }
  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }
  h1 { font-size: 1.3em; margin: 0 0 4px 0; }
  .subtitle { color: var(--text-dim); font-size: 0.85em; margin-bottom: 12px; }
  .sync-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75em;
    color: var(--text-dim);
    margin-bottom: 12px;
    padding: 8px 10px;
    background: var(--card);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
  .sync-dot.ok { background: var(--accent); }
  .sync-dot.error { background: #c97a7a; }
  .sync-dot.syncing { background: #f0ad4e; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .progress-bar-wrap {
    background: var(--card);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .progress-text { display: flex; justify-content: space-between; font-size: 0.85em; margin-bottom: 6px; }
  .progress-track { height: 8px; background: #2a2f33; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
  .search-wrap { margin-bottom: 12px; }
  #search, #crop-search {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1em;
  }
  .skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .skill-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .skill-name { font-weight: 600; font-size: 1em; }
  .skill-count { font-size: 0.8em; color: var(--text-dim); display: flex; align-items: center; gap: 8px; }
  .skill-count.complete { color: var(--accent); }
  .chevron { transition: transform 0.2s; font-size: 0.8em; }
  .skill-card.open .chevron { transform: rotate(90deg); }
  .volumes { display: none; padding: 0 14px 12px 14px; }
  .skill-card.open .volumes { display: block; }
  .volume-row { display: flex; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
  .volume-row label { display: flex; align-items: center; gap: 10px; width: 100%; cursor: pointer; }
  .volume-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0; }
  .volume-label { font-size: 0.9em; }
  .volume-label .checked { color: var(--accent); text-decoration: line-through; text-decoration-color: var(--accent-dim); }
  .category-title { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 18px 0 8px 2px; }
  .sort-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .sort-btn {
    flex: 1;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 0.85em;
    text-align: center;
    cursor: pointer;
  }
  .sort-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .reset-btn {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: transparent;
    border: 1px solid #7a3030;
    color: #c97a7a;
    border-radius: 8px;
    font-size: 0.9em;
    cursor: pointer;
  }
  .note { font-size: 0.75em; color: var(--text-dim); margin-top: 14px; text-align: center; }
  .note a { color: var(--accent); }
  .section-title { font-size: 1.1em; font-weight: 600; margin: 0 0 10px 0; }
  .month-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; -webkit-overflow-scrolling: touch; }
  .month-chip {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 0.82em;
    white-space: nowrap;
    cursor: pointer;
  }
  .month-chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .crop-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .crop-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .crop-name { font-weight: 600; font-size: 0.98em; }
  .crop-type { font-size: 0.72em; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .crop-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8em; color: var(--text-dim); }
  .crop-meta b { color: var(--text); font-weight: 500; }
  .crop-hardy { color: var(--accent); }
  .crop-count { font-size: 0.8em; color: var(--text-dim); margin-bottom: 10px; }
</style>

<body>

<!-- Tab Navigation -->
<nav class="tab-nav">

<!-- Skills Tab -->
<div id="tab-skills" class="tab-content active">

  <div class="sync-status">
    <span class="sync-dot" id="sync-dot"></span>
    <span id="sync-text">Connecting...</span>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-text">
      <span id="progress-label">0 / 120 found</span>
      <span id="progress-percent">0%</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

    <input type="text" id="search" placeholder="Search skill...">
  </div>

    <button class="sort-btn active" id="sort-category" data-mode="category">By Category</button>

<!-- Farming Calendar Tab -->
<div id="tab-farming" class="tab-content">

<script>
/* ========== SKILL DATA ========== */
const DATA = {
  "Crafts (full rate)": [
    "Carpentry", "Cooking", "Electrical", "Welding", "Mechanics",
    "Tailoring", "Blacksmithing", "Carving", "Knapping", "Glassmaking",
    "Masonry", "Pottery"
  ],
  "Survival (full rate)": [
    "First Aid", "Fishing", "Trapping", "Foraging", "Tracking",
    "Agriculture", "Animal Care", "Butchering", "Maintenance"
  ],
  "Combat & Firearms (reduced rate)": [
    "Aiming", "Reloading", "Long Blade"
  ]
};

/* ========== STATE ========== */
let state = {};
let syncTimeout = null;

/* ========== SERVER SYNC ========== */
const API_URL = '/api/progress';

function updateSyncStatus(status, text) {
  document.getElementById("sync-dot").className = "sync-dot " + status;
  document.getElementById("sync-text").textContent = text;
}

async function loadFromServer() {
  updateSyncStatus("syncing", "Loading...");
  try {
    const res = await fetch(API_URL);
    if (!res.ok) throw new Error(`Status ${res.status}`);
    const data = await res.json();
    if (data.progress) {
      state = data.progress;
    }
    updateSyncStatus("ok", "Synced");
    return true;
  } catch (e) {
    console.error("Load failed:", e);
    updateSyncStatus("error", "Sync error");
    return false;
  }
}

async function saveToServer() {
  updateSyncStatus("syncing", "Saving...");
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ progress: state })
    });
    if (!res.ok) throw new Error(`Status ${res.status}`);
    updateSyncStatus("ok", "Synced");
  } catch (e) {
    console.error("Save failed:", e);
    updateSyncStatus("error", "Sync error");
  }
}

function scheduleSyncSave() {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(saveToServer, 1000);
}

function saveState() {
  scheduleSyncSave();
}

/* ========== SKILL HELPERS ========== */
function volKey(skill, vol) { return skill + "|" + vol; }

function countChecked(skill) {
  let c = 0;
  for (let v = 1; v <= 5; v++) {
    if (state[volKey(skill, v)]) c++;
  }
  return c;
}

function totalChecked() {
  let c = 0;
  Object.keys(state).forEach(k => { if (state[k]) c++; });
  return c;
}

let sortMode = "category";

function allSkillsFlat() {
  const all = [];
  Object.keys(DATA).forEach(cat => DATA[cat].forEach(s => all.push(s)));
  return all;
}

/* ========== RENDERING ========== */
function buildSkillCard(list, skill, roman) {
  const card = document.createElement("div");
  card.className = "skill-card";
  card.dataset.skill = skill.toLowerCase();

  const header = document.createElement("div");
  header.className = "skill-header";

  const name = document.createElement("div");
  name.className = "skill-name";
  name.textContent = skill;

  const countWrap = document.createElement("div");
  countWrap.className = "skill-count";
  const checkedCount = countChecked(skill);
  countWrap.innerHTML = `<span class="count-text">${checkedCount}/5</span><span class="chevron">▶</span>`;
  if (checkedCount === 5) countWrap.classList.add("complete");

  header.appendChild(name);
  header.appendChild(countWrap);

  const volumes = document.createElement("div");
  volumes.className = "volumes";

  for (let v = 1; v <= 5; v++) {
    const row = document.createElement("div");
    row.className = "volume-row";
    const key = volKey(skill, v);
    const checked = !!state[key];

    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = checked;
    cb.addEventListener("change", () => {
      state[key] = cb.checked;
      saveState();
      updateSkillHeader(card, skill);
      updateProgress();
    });

    const volLabel = document.createElement("span");
    volLabel.className = "volume-label";
    volLabel.innerHTML = checked
      ? `<span class="checked">Vol. ${roman[v-1]}</span>`
      : `Vol. ${roman[v-1]}`;

    label.appendChild(cb);
    label.appendChild(volLabel);
    row.appendChild(label);
    volumes.appendChild(row);
  }

  header.addEventListener("click", () => card.classList.toggle("open"));
  card.appendChild(header);
  card.appendChild(volumes);
  list.appendChild(card);
}

function render() {
  const list = document.getElementById("skill-list");
  list.innerHTML = "";
  const roman = ["I", "II", "III", "IV", "V"];

  if (sortMode === "alpha") {
    allSkillsFlat().sort((a, b) => a.localeCompare(b)).forEach(s => buildSkillCard(list, s, roman));
  } else {
    Object.keys(DATA).forEach(cat => {
      const catTitle = document.createElement("div");
      catTitle.className = "category-title";
      catTitle.textContent = cat;
      list.appendChild(catTitle);
      DATA[cat].forEach(s => buildSkillCard(list, s, roman));
    });
  }
  updateProgress();
}

function updateSkillHeader(card, skill) {
  const checkedCount = countChecked(skill);
  card.querySelector(".count-text").textContent = `${checkedCount}/5`;
  card.querySelector(".skill-count").classList.toggle("complete", checkedCount === 5);

  card.querySelectorAll(".volume-row").forEach((row, i) => {
    const checked = !!state[volKey(skill, i + 1)];
    const romanN = ["I","II","III","IV","V"][i];
    row.querySelector(".volume-label").innerHTML = checked
      ? `<span class="checked">Vol. ${romanN}</span>`
      : `Vol. ${romanN}`;
  });
}

function updateProgress() {
  const total = totalChecked();
  const percent = Math.round((total / 120) * 100);
  document.getElementById("progress-label").textContent = `${total} / 120 found`;
  document.getElementById("progress-percent").textContent = `${percent}%`;
  document.getElementById("progress-fill").style.width = percent + "%";
}

/* ========== EVENT HANDLERS ========== */
document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll(".skill-card").forEach(card => {
    const match = card.dataset.skill.includes(q);
    card.style.display = match ? "" : "none";
    if (q && match) card.classList.add("open");
  });
});

document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    sortMode = btn.dataset.mode;
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    render();
  });
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Really reset all checkmarks?")) {
    state = {};
    saveState();
    render();
  }
});

const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function monthIdx(abbr) { return MONTH_ABBR.indexOf(abbr.trim()) + 1; }

function parseMonthField(str) {
  if (!str || str === "—") return [];
  const out = new Set();
  str.split(",").forEach(part => {
    part = part.trim();
    if (part.includes("–")) {
      const [a, b] = part.split("–").map(s => s.trim());
      let start = monthIdx(a), end = monthIdx(b);
      if (start === 0 || end === 0) return;
      if (start <= end) {
        for (let m = start; m <= end; m++) out.add(m);
      } else {
        for (let m = start; m <= 12; m++) out.add(m);
        for (let m = 1; m <= end; m++) out.add(m);
      }
    } else {
      const m = monthIdx(part);
      if (m > 0) out.add(m);
    }
  });
  return [...out];
}

let cropMonthFilter = 0;

function renderMonthChips() {
  const wrap = document.getElementById("month-chips");
  wrap.innerHTML = "";
  
  const allChip = document.createElement("button");
  allChip.className = "month-chip" + (cropMonthFilter === 0 ? " active" : "");
  allChip.textContent = "All";
  allChip.addEventListener("click", () => { cropMonthFilter = 0; renderMonthChips(); renderCrops(); });
  wrap.appendChild(allChip);

  MONTH_ABBR.forEach((abbr, i) => {
    const chip = document.createElement("button");
    chip.className = "month-chip" + (cropMonthFilter === i + 1 ? " active" : "");
    chip.textContent = abbr;
    chip.addEventListener("click", () => { cropMonthFilter = i + 1; renderMonthChips(); renderCrops(); });
    wrap.appendChild(chip);
  });
}

function renderCrops() {
  const list = document.getElementById("crop-list");
  list.innerHTML = "";
  const query = (document.getElementById("crop-search").value || "").toLowerCase().trim();

  let filtered = CROPS.filter(c => c.n.toLowerCase().includes(query));
  if (cropMonthFilter !== 0) {
    filtered = filtered.filter(c => parseMonthField(c.p).includes(cropMonthFilter));
  }
  filtered.sort((a, b) => a.n.localeCompare(b.n));

  document.getElementById("crop-count").textContent =
    cropMonthFilter === 0
      ? `${filtered.length} Crops`
      : `${filtered.length} Crops plantable in ${MONTH_ABBR[cropMonthFilter - 1]}`;

  filtered.forEach(c => {
    const card = document.createElement("div");
    card.className = "crop-card";
    card.innerHTML = `
      <div class="crop-top">
        <span class="crop-name">${c.n}</span>
        <span class="crop-type">${c.t}</span>
      </div>
      <div class="crop-meta">
        <span><b>Plant window:</b> ${c.p}</span>
        <span><b>Best time:</b> ${c.best}</span>
        <span><b>Bad months:</b> ${c.bad}</span>
        <span><b>Water min.:</b> ${c.w}</span>
        <span><b>Days:</b> ${c.d}</span>
        ${c.hardy ? '<span class="crop-hardy">❄️ Frost-hardy</span>' : ""}
      </div>
    `;
    list.appendChild(card);
  });
}

document.getElementById("crop-search").addEventListener("input", renderCrops);

/* ========== TAB NAVIGATION ========== */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const tabId = btn.dataset.tab;
    
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    document.querySelectorAll(".tab-content").forEach(content => {
      content.classList.remove("active");
    });
    document.getElementById("tab-" + tabId).classList.add("active");
  });
});

/* ========== INIT ========== */
async function init() {
  await loadFromServer();
  render();
  renderMonthChips();
  renderCrops();
}

init();
</script>

</body>
