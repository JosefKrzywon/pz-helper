<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Zomboid Helper</title>
<style>
  :root {
    --bg: #14171a;
    --card: #1f2428;
    --accent: #7fbf3f;
    --accent-dim: #3d5a20;
    --text: #e8e8e8;
    --text-dim: #9a9a9a;
    --border: #2c3237;
    --error: #c97a7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    max-width: 360px;
    width: 100%;
  }
  h1 {
    font-size: 1.4em;
    margin: 0 0 8px 0;
    text-align: center;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 0.9em;
    text-align: center;
    margin-bottom: 24px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 0.85em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1em;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .login-btn {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #111;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .login-btn:hover {
    background: #8fcf4f;
  }
  .login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .error-msg {
    background: rgba(201, 122, 122, 0.1);
    border: 1px solid var(--error);
    color: var(--error);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.9em;
    margin-bottom: 16px;
    display: none;
  }
  .error-msg.visible {
    display: block;
  }
</style>
</head>
<body>

<div class="login-card">
  <h1>🧟 Zomboid Helper</h1>
  <div class="subtitle">Sign in to access your checklist</div>
  
  <div class="error-msg" id="error-msg"></div>
  
  <form id="login-form">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
    </div>
    
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    
    <button type="submit" class="login-btn" id="login-btn">Sign In</button>
  </form>
</div>

<script>
const form = document.getElementById('login-form');
const errorMsg = document.getElementById('error-msg');
const loginBtn = document.getElementById('login-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  
  if (!username || !password) {
    showError('Please enter username and password');
    return;
  }
  
  loginBtn.disabled = true;
  loginBtn.textContent = 'Signing in...';
  errorMsg.classList.remove('visible');
  
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
      credentials: 'include'
    });
    
    const data = await res.json();
    
    if (!res.ok) {
      showError(data.error || 'Login failed');
      return;
    }
    
    // Success - redirect to main app
    window.location.href = '/';
    
  } catch (err) {
    showError('Connection error. Please try again.');
    console.error(err);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = 'Sign In';
  }
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.add('visible');
}
</script>

</body>
</html>
