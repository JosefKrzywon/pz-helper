AWSTemplateFormatVersion: '2010-09-09'
Description: 'PZ Skill Books - Complete Stack (CloudFront + S3 + Lambda + DynamoDB)'

Parameters:
  BucketPrefix:
    Type: String
    Description: 'Prefix for resource names'
    Default: 'pz-skillbooks'
    AllowedPattern: '[a-z0-9-]+'

  DomainName:
    Type: String
    Description: 'Custom domain'

  HostedZoneId:
    Type: String
    Description: 'Route53 Hosted Zone ID'

  CertificateArn:
    Type: String
    Description: 'ACM Certificate ARN in us-east-1'

  AdminUsername:
    Type: String
    Description: 'Initial admin username'
    Default: 'admin'

  AdminPasswordHash:
    Type: String
    Description: 'Admin password hash (sha256:salt:hash)'
    NoEcho: true

  SessionSecret:
    Type: String
    Description: 'Secret for signing session cookies'
    NoEcho: true

Resources:
  # ============================================================
  # DYNAMODB TABLES
  # ============================================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${BucketPrefix}-users'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  ProgressTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${BucketPrefix}-progress'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: visibleId
          AttributeType: S
      KeySchema:
        - AttributeName: visibleId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  # ============================================================
  # S3 BUCKET (website content)
  # ============================================================
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-website-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  # ============================================================
  # LAMBDA FUNCTION (API)
  # ============================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketPrefix}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt ProgressTable.Arn
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${BucketPrefix}-api'
      Description: 'PZ Skill Books API (Login, Sync, Admin)'
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          PROGRESS_TABLE: !Ref ProgressTable
          SESSION_SECRET: !Ref SessionSecret
          ADMIN_USERNAME: !Ref AdminUsername
      Code:
        S3Bucket: !Sub '${BucketPrefix}-artifacts-${AWS::AccountId}'
        S3Key: lambda/api-function.zip
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  # Lambda URL for CloudFront origin
  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt ApiFunction.Arn

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # IMPORTANT: Lambda URLs require BOTH permissions to work!
  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: '*'

  # ============================================================
  # CLOUDFRONT FUNCTION (Auth)
  # ============================================================
  AuthFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${BucketPrefix}-auth'
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var cookies = request.cookies || {};
          var uri = request.uri;
          
          // Allow API requests through (Lambda handles auth)
          if (uri.startsWith('/api/')) {
            return request;
          }
          
          // Check for session cookie
          var sessionCookie = cookies['pz_session'];
          if (sessionCookie && sessionCookie.value) {
            // Cookie exists, allow through
            return request;
          }
          
          // No session - redirect to login page
          // But allow login.html itself
          if (uri === '/login.html' || uri.startsWith('/api/')) {
            return request;
          }
          
          // Redirect to login
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: {
              'location': { value: '/login.html' }
            }
          };
        }
      FunctionConfig:
        Comment: 'Auth check for PZ Skill Books'
        Runtime: cloudfront-js-2.0

  # ============================================================
  # CLOUDFRONT DISTRIBUTION
  # ============================================================
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${BucketPrefix}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: 'PZ Skill Books'
        DefaultRootObject: index.html
        Aliases:
          - !Ref DomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          # S3 Origin for static files
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Lambda Origin for API
          - Id: ApiOrigin
            DomainName: !Select [2, !Split ['/', !GetAtt ApiFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              HTTPSPort: 443
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AuthFunction.FunctionARN
        CacheBehaviors:
          # API requests go to Lambda
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
        PriceClass: PriceClass_100
        HttpVersion: http2and3
      Tags:
        - Key: Project
          Value: !Ref BucketPrefix

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ============================================================
  # ROUTE53 DNS
  # ============================================================
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DNSRecordIPv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  WebsiteURL:
    Value: !Sub 'https://${DomainName}'

  WebsiteBucketName:
    Value: !Ref WebsiteBucket

  UsersTableName:
    Value: !Ref UsersTable

  ProgressTableName:
    Value: !Ref ProgressTable

  CloudFrontDistributionId:
    Value: !Ref CloudFrontDistribution
