AWSTemplateFormatVersion: '2010-09-09'
Description: 'PZ Skillbuecher Checkliste - Lambda Sync Backend'

Parameters:
  Username:
    Type: String
    Description: 'Login username'
    MinLength: 1
    Default: 'admin'
  
  PasswordHash:
    Type: String
    Description: 'PBKDF2 password hash (generated by set-password.sh)'
    NoEcho: true
    MinLength: 1

  BucketPrefix:
    Type: String
    Description: 'Prefix for S3 bucket name (must be globally unique)'
    Default: 'pz-skillbuecher'
    AllowedPattern: '[a-z0-9-]+'

Resources:
  # S3 Bucket for progress data
  ProgressBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${BucketPrefix}-progress-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: pz-skillbuecher

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${BucketPrefix}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${ProgressBucket.Arn}/*'

  # Lambda Function
  SyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${BucketPrefix}-sync'
      Description: 'PZ Skillbuecher progress sync handler'
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          BUCKET_NAME: !Ref ProgressBucket
          AUTH_USERNAME: !Ref Username
          AUTH_PASSWORD_HASH: !Ref PasswordHash
      Code:
        S3Bucket: !Sub '${BucketPrefix}-artifacts-${AWS::AccountId}'
        S3Key: lambda/sync-function.zip
      Tags:
        - Key: Project
          Value: pz-skillbuecher

  # Lambda Function URL (public, but auth handled in code)
  SyncFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt SyncFunction.Arn
      Cors:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
        MaxAge: 86400

  # Permission for Function URL to invoke Lambda
  SyncFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SyncFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

Outputs:
  FunctionUrl:
    Description: 'Lambda Function URL - use this in the app'
    Value: !GetAtt SyncFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${AWS::StackName}-FunctionUrl'

  BucketName:
    Description: 'S3 Bucket for progress data'
    Value: !Ref ProgressBucket

  Username:
    Description: 'Configured username'
    Value: !Ref Username
