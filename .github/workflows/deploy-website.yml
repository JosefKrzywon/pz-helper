name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - 'index*.html'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:
    inputs:
      invalidate_cache:
        description: 'Invalidate CloudFront cache'
        required: false
        default: 'true'
        type: boolean

env:
  AWS_REGION: eu-central-1

jobs:
  deploy:
    name: Deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    
    # Only run if secrets are configured
    if: ${{ vars.WEBSITE_BUCKET_NAME != '' }}
    
    permissions:
      id-token: write   # For OIDC authentication
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          echo "Uploading HTML files to S3..."
          aws s3 cp index.html "s3://${{ vars.WEBSITE_BUCKET_NAME }}/index.html" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp index-gist.html "s3://${{ vars.WEBSITE_BUCKET_NAME }}/index-gist.html" \
            --content-type "text/html; charset=utf-8"
          aws s3 cp index-lambda.html "s3://${{ vars.WEBSITE_BUCKET_NAME }}/index-lambda.html" \
            --content-type "text/html; charset=utf-8"
          echo "Upload complete!"

      - name: Invalidate CloudFront Cache
        if: ${{ github.event.inputs.invalidate_cache != 'false' }}
        run: |
          echo "Invalidating CloudFront cache..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation ID: $INVALIDATION_ID"
          echo "Cache invalidation initiated (takes 1-2 minutes to complete)"

      - name: Summary
        run: |
          echo "## Deployment Complete! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files uploaded:**" >> $GITHUB_STEP_SUMMARY
          echo "- index.html" >> $GITHUB_STEP_SUMMARY
          echo "- index-gist.html" >> $GITHUB_STEP_SUMMARY
          echo "- index-lambda.html" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Website URL:** https://${{ vars.WEBSITE_DOMAIN }}" >> $GITHUB_STEP_SUMMARY
